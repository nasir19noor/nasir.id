name: 'Debug ucl backend'

# Manual only. Dumps the backend container's state and logs so a failing
# startup can be diagnosed without SSH access to the server.
on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: [self-hosted, nasir-contabo]
    steps:
      - name: Container state and logs
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          echo "===== docker ps -a (ucl) ====="
          echo "$SSH_PASSWORD" | sudo -S docker ps -a --filter "name=ucl-" \
            --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || true

          echo ""
          echo "===== docker inspect (exit code / restarts) ====="
          echo "$SSH_PASSWORD" | sudo -S docker inspect ucl-backend \
            --format 'State={{.State.Status}} ExitCode={{.State.ExitCode}} Restarts={{.RestartCount}} OOM={{.State.OOMKilled}} Error={{.State.Error}}' || true

          echo ""
          echo "===== docker logs ucl-backend (last 200 lines) ====="
          echo "$SSH_PASSWORD" | sudo -S docker logs --tail 200 ucl-backend 2>&1 || true
