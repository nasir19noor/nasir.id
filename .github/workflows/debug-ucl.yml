name: 'Debug ucl backend (temporary)'

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: [self-hosted, nasir-contabo]
    steps:
      - name: Container state and logs (secrets redacted)
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          echo "$SSH_PASSWORD" | sudo -S docker ps -a --filter name=ucl-backend --format '{{.Names}} {{.Status}}'
          echo "--- .env keys in S3 (values redacted) ---"
          aws s3 cp s3://ucl.nasir.id/backend/.env - | sed 's/=.*/=***/'
          echo "--- last 60 log lines (redacted) ---"
          echo "$SSH_PASSWORD" | sudo -S docker logs --tail 60 ucl-backend 2>&1 | sed -E 's#(postgresql://[^:]+:)[^@]+@#\1***@#g'
