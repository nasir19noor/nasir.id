name: 'Deploy esim.nasir.id'

on:
  push:
    paths:
      - 'apps/esim/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-esim:
    runs-on: [self-hosted, nasir-contabo]

    steps:
    - name: Remove stale nested .git directories
      run: find "$GITHUB_WORKSPACE" -mindepth 2 -name ".git" -exec rm -rf {} + 2>/dev/null || true

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Deploy esim
      env:
        SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      working-directory: apps/esim
      run: |
        echo "Stopping and removing existing esim container..."
        echo "$SSH_PASSWORD" | sudo -S docker stop esim 2>/dev/null || true
        echo "$SSH_PASSWORD" | sudo -S docker rm esim 2>/dev/null || true
        echo "$SSH_PASSWORD" | sudo -S docker rmi esim:latest 2>/dev/null || true

        echo "Building esim image..."
        echo "$SSH_PASSWORD" | sudo -S docker build -t esim:latest .

        echo "Running esim container..."
        echo "$SSH_PASSWORD" | sudo -S docker run -d -p 6000:6000 \
          --restart unless-stopped \
          --name esim esim:latest

        echo "esim deployed successfully"

    - name: Verify esim is serving
      run: |
        for i in $(seq 1 10); do
          if curl -fsS -o /dev/null http://localhost:6000/; then
            echo "esim healthy"
            exit 0
          fi
          echo "Waiting for esim... ($i/10)"
          sleep 3
        done
        echo "esim did not become healthy"
        exit 1
