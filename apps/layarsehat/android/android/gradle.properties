# Runner Contabo dipakai bersama seluruh kontainer aplikasi lain, jadi jejak
# memori build ditekan sekecil mungkin agar tidak dihabisi OOM killer.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true

android.useAndroidX=true

# Kompilasi Kotlin ikut proses Gradle. Tanpa ini Kotlin menyalakan daemon JVM
# sendiri yang meminta ~2 GB terpisah — penyebab utama build tumbang di runner.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

# Jetifier hanya diperlukan untuk pustaka Support Library lama. Semua paket yang
# dipakai di sini sudah AndroidX, jadi mematikannya menghemat memori dan waktu.
android.enableJetifier=false
